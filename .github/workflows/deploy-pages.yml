name: Deploy site to GitHub Pages

# Publishes by syncing the default branch to gh-pages, which GitHub
# auto-serves for public repos. (configure-pages enablement:true is not
# usable here: GITHUB_TOKEN can't create the Pages site on user repos.)

on:
  push:
    branches: ["claude/ai-business-training-po4uya"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync to gh-pages
        run: git push origin HEAD:gh-pages --force
